<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Mentoría Trading</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-800">
    <div style="max-width: 450px;" class="mx-auto min-h-screen bg-white shadow-2xl p-6">
        
        <header class="text-center mb-8">
            <h1 class="text-2xl font-black text-blue-900">MENTORÍA TRADING</h1>
            <p class="text-slate-500 text-xs uppercase tracking-widest">Gestión Jhon Jairo</p>
        </header>

        <div id="seccion-login" class="block">
            <div class="bg-slate-50 p-6 rounded-3xl border shadow-inner">
                <input type="password" id="pass" placeholder="Contraseña de acceso" class="w-full p-4 rounded-2xl mb-4 border-2 outline-none focus:border-blue-500">
                <button onclick="entrar()" class="w-full bg-blue-900 text-white p-4 rounded-2xl font-bold shadow-lg">INGRESAR AHORA</button>
            </div>
        </div>

        <div id="seccion-menu" class="hidden space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <button onclick="mostrarAlerta('Ingresos')" class="bg-emerald-500 text-white p-6 rounded-3xl shadow-lg font-bold">💰 INGRESOS</button>
                <button onclick="mostrarAlerta('Gastos')" class="bg-rose-500 text-white p-6 rounded-3xl shadow-lg font-bold">💸 GASTOS</button>
                <button onclick="mostrarAlerta('Listado')" class="bg-blue-600 text-white p-6 rounded-3xl shadow-lg font-bold col-span-2 text-xl">📊 VER LISTADOS</button>
                <button onclick="mostrarAlerta('Proyección')" class="bg-indigo-700 text-white p-6 rounded-3xl shadow-lg font-bold col-span-2">🚀 PROYECCIÓN 3 MESES</button>
            </div>
            <button onclick="location.reload()" class="w-full text-slate-400 text-sm mt-8">Cerrar Sesión</button>
        </div>

    </div>

    <script>
        // Función de entrada directa
        function entrar() {
            const clave = document.getElementById('pass').value;
            if(clave !== "") {
                document.getElementById('seccion-login').style.display = 'none';
                document.getElementById('seccion-menu').style.display = 'block';
            } else {
                alert("Escribe cualquier contraseña para probar");
            }
        }

        // Función para probar botones
        function mostrarAlerta(nombre) {
            alert("Has tocado el botón: " + nombre + ". La lógica está activa.");
        }
    </script>
</body>
</html>
