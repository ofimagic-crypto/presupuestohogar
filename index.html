<!DOCTYPE html>
<html lang="es">

    <style>
        .contenedor-app { max-width: 500px; margin: 0 auto; min-height: 100vh; background: #f1f5f9; }

        .input-estilo { 
            border: 2px solid #cbd5e1 !important;

        .caja-pass { position: relative; width: 100%; }
        .ojo-click { 
            position: absolute; right: 0; top: 0; height: 100%; width: 50px;

            cursor: pointer; z-index: 999; color: #64748b;
        }

        .btn-entrar {
            background-color: #0f172a; color: white; width: 100%; padding: 20px;
            border-radius: 16px; font-weight: 900; text-transform: uppercase;
            cursor: pointer; border: none; margin-top: 10px;
        }
        .btn-entrar:active { transform: scale(0.95); }
    </style>
</head>
