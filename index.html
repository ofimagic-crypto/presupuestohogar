<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App Presupuesto Hogar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: sans-serif; touch-action: manipulation; }
        .boton-menu { transition: all 0.2s; border-radius: 1rem; }
        .boton-menu:active { transform: scale(0.95); }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">
    <div id="app" class="max-w-md mx-auto p-4">
        <div class="text-center py-6">
            <h1 class="text-2xl font-extrabold text-blue-900 tracking-tight">MENTORÍA TRADING</h1>
            <p class="text-slate-500 text-sm">Control de Presupuesto Real</p>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-8">
            <button class="boton-menu bg-emerald-500 text-white p-6 shadow-lg shadow-emerald-200">
                <span class="block text-2xl">💰</span>
                <span class="font-bold">Ingresos</span>
            </button>
            <button class="boton-menu bg-rose-500 text-white p-6 shadow-lg shadow-rose-200">
                <span class="block text-2xl">💸</span>
                <span class="font-bold">Gastos</span>
            </button>
            <button class="boton-menu bg-blue-600 text-white p-6 shadow-lg shadow-blue-200">
                <span class="block text-2xl">📊</span>
                <span class="font-bold">Listado</span>
            </button>
            <button class="boton-menu bg-indigo-700 text-white p-6 shadow-lg shadow-indigo-200">
                <span class="block text-2xl">🚀</span>
                <span class="font-bold">Proyección</span>
            </button>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 text-center">
            <p class="text-slate-600">Bienvenido, <strong>Jhon Jairo</strong></p>
            <p class="text-xs text-slate-400 mt-2 italic">"La disciplina financiera es la base del éxito en el Trading"</p>
        </div>
    </div>
</body>
</html>
