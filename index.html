<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presupuesto Hogar - Ebooks Magic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .contenedor-app { max-width: 500px; margin: 0 auto; min-height: 100vh; background: #f1f5f9; }
        .pantalla { display: none; }
        .pantalla.activa { display: block; }
        
        input { 
            border: 2px solid #cbd5e1 !important; 
            border-radius: 12px; padding: 16px; width: 100%; 
            outline: none; background: white; font-weight: 900; 
            text-align: center; font-size: 1.1rem;
        }

        .caja-pass { position: relative; width: 100%; display: flex; align-items: center; }
        .btn-ojo { position: absolute; right: 15px; cursor: pointer; z-index: 100; color: #64748b; padding: 10px; }

        .btn-negro { background-color: #1e293b; color: white; width: 100%; padding: 20px; border-radius: 16px; font-weight: 900; text-transform: uppercase; cursor: pointer; margin-top: 10px; }
        .btn-menu { width: 100%; padding: 22px; border-radius: 20px; font-weight: 900; display: flex; justify-content: space-between; align-items: center; color: white; margin-bottom: 8px; }
        .btn-menu:active { transform: scale(0.97); }
    </style>
</head>
<body class="bg-slate-300">

    <div class="contenedor-app p-6 flex flex-col font-sans">
        
        <header class="text-center py-4 border-b-2 border-slate-200 mb-8">
            <h1 class="text-3xl font-black text-slate-800 uppercase">Presupuesto Hogar</h1>
            <p class="text-blue-600 font-bold text-sm tracking-widest">Ebooks Magic</p>
        </header>

        <div id="p-login" class="pantalla activa">
            <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl border space-y-6">
                <input type="text" id="usuario" placeholder="USUARIO" class="uppercase">
                <div class="caja-pass">
                    <input type="password" id="clave" placeholder="CONTRASEÑA">
                    <div class="btn-ojo" onclick="toggleVisibilidad()">
                        <i id="ojo-icon" class="fa-solid fa-eye"></i>
                    </div>
                </div>
                <button type="button" onclick="intentarEntrar()" class="btn-negro">Entrar Ahora</button>
            </div>
        </div>

        <div id="p-menu" class="pantalla space-y-4">
            <div class="bg-slate-800 text-white p-10 rounded-[3rem] text-center border-b-8 border-blue-500 shadow-2xl mb-6">
                <p id="usr-saludo" class="text-blue-300 text-xs font-black uppercase mb-2 tracking-tighter"></p>
                <h2 id="saldo-display" class="text-5xl font-black">$ 0</h2>
            </div>

            <div class="flex flex-col">
                <button onclick="abrirGestion('ingresos')" class="btn-menu bg-emerald-500 shadow-md"><span>💰 INGRESOS</span> <i class="fa-solid fa-chevron-right"></i></button>
                <button onclick="abrirGestion('egresos')" class="btn-menu bg-rose-500 shadow-md"><span>💸 EGRESOS</span> <i class="fa-solid fa-chevron-right"></i></button>
                <button onclick="navegar('p-pregunta')" class="btn-menu bg-blue-600 shadow-md"><span>📊 LISTADO</span> <i class="fa-solid fa-list-ul"></i></button>
                <button onclick="alert('Próximamente: Clasificar')" class="btn-menu bg-amber-500 shadow-md"><span>🔍 CLASIFICAR</span> <i class="fa-solid fa-tags"></i></button>
                <button onclick="alert('Próximamente: Proyectar')" class="btn-menu bg-indigo-700 shadow-md"><span>🚀 PROYECTAR AJUSTES</span> <i class="fa-solid fa-chart-line"></i></button>
            </div>

            <button onclick="location.reload()" class="w-full text-slate-400 font-black py-8 text-xs uppercase">Cerrar Sesión</button>
        </div>

        <div id="p-gestion" class="pantalla space-y-4">
            <div class="bg-white p-6 rounded-3xl shadow border text-center">
                <h2 id="gestion-titulo" class="text-2xl font-black uppercase text-slate-700"></h2>
            </div>

            <div class="bg-white p-8 rounded-[2.5rem] shadow-xl border space-y-4">
                <input type="text" id="g-concepto" placeholder="¿QUÉ ES?" class="uppercase">
                <input type="date" id="g-fecha">
                <input type="number" id="g-valor" placeholder="VALOR $">
                
                <button onclick="guardarDato()" class="btn-negro !bg-emerald-600">GUARDAR</button>
                <button onclick="navegar('p-menu')" class="w-full text-slate-400 font-bold pt-2">VOLVER</button>
            </div>
        </div>

        <div id="p-pregunta" class="pantalla">
            <div
