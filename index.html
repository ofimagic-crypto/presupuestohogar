<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presupuesto Hogar - Ebooks Magic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .contenedor-app { max-width: 500px; margin: 0 auto; min-height: 100vh; background: #f1f5f9; }
        .pantalla { display: none; }
        .pantalla.activa { display: block; }
        input { border: 2px solid #cbd5e1 !important; border-radius: 12px; padding: 14px; width: 100%; outline: none; background: white; font-weight: bold; text-align: center; }
        
        /* Ojo y Botones de Entrada */
        .caja-pass { position: relative; width: 100%; }
        .btn-ojo { position: absolute; right: 0; top: 0; height: 100%; width: 50px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 100; color: #64748b; }
        .btn-negro { background-color: #1e293b; color: white; width: 100%; padding: 18px; border-radius: 16px; font-weight: 900; text-transform: uppercase; cursor: pointer; margin-top: 10px; }
        
        /* Menú de Botones */
        .btn-menu { width: 100%; padding: 20px; border-radius: 20px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; color: white; transition: 0.1s; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .btn-menu:active { transform: scale(0.96); }
    </style>
</head>
<body class="bg-slate-300">

    <div class="contenedor-app p-4 flex flex-col font-sans">
        
        <header class="text-center py-4 border-b-2 border-slate-200 mb-6">
            <h1 class="text-2xl font-black text-slate-800">PRESUPUESTO HOGAR</h1>
            <p class="text-blue-600 font-bold text-sm italic uppercase tracking-wider">Ebooks Magic</p>
        </header>

        <div id="p-login" class="pantalla activa">
            <div class="bg-white p-8 rounded-[2rem] shadow-2xl border space-y-4">
                <input type="text" id="usuario" placeholder="USUARIO" class="uppercase">
                <div class="caja-pass">
                    <input type="password" id="clave" placeholder="CONTRASEÑA">
                    <div class="btn-ojo" onclick="verClave()">
                        <i id="ojo-img" class="fa-solid fa-eye"></i>
                    </div>
                </div>
                <button type="button" id="btn-submit" onclick="entrar()" class="btn-negro">Entrar</button>
            </div>
        </div>

        <div id="p-menu" class="pantalla space-y-4">
            <div class="bg-slate-800 text-white p-8 rounded-[2.5rem] text-center border-b-4 border-blue-500 shadow-xl">
                <p id="usr-tag" class="text-blue-300 text-[10px] font-bold uppercase mb-2"></p>
                <h2 id="saldo-txt" class="text-4xl font-black">$ 0</h2>
            </div>

            <div class="grid gap-3">
                <button onclick="irSeccion('ingresos')" class="btn-menu bg-emerald-500"><span>💰 INGRESOS</span> <i class="fa-solid fa-plus-circle"></i></button>
                <button onclick="irSeccion('egresos')" class="btn-menu bg-rose-500"><span>💸 EGRESOS</span> <i class="fa-solid fa-minus-circle"></i></button>
                <button onclick="preguntarListado()" class="btn-menu bg-blue-600"><span>📊 LISTADO</span> <i class="fa-solid fa-list-ul"></i></button>
                <button onclick="irSeccion('clasificar')" class="btn-menu bg-amber-500"><span>🔍 CLASIFICAR</span> <i class="fa-solid fa-tags"></i></button>
                <button onclick="irSeccion('proyectar')" class="btn-menu bg-indigo-700"><span>🚀 PROYECTAR AJUSTES</span> <i class="fa-solid fa-chart-line"></i></button>
            </div>

            <button onclick="location.reload()" class="w-full text-slate-400 font-bold py-6 text-xs uppercase">Cerrar Sesión</button>
        </div>

        <div id="p-preg-listado" class="pantalla">
            <div class="bg-white p-8 rounded-[2rem] shadow-2xl border text-center space-y-4">
                <p class="font-bold text-slate-700 uppercase text-sm">¿Qué listado desea generar?</p>
                <button onclick="irSeccion('listado-in')" class="w-full bg-emerald-500 text-white p-4 rounded-xl font-bold">LISTADO DE INGRESOS</button>
                <button onclick="irSeccion('listado-out')" class="w-full bg-rose-500 text-white p-4 rounded-xl font-bold">LISTADO DE EGRESOS</button>
                <button onclick="navegar('p-menu')" class="w-full text-slate-400 font-bold pt-4 text-xs">VOLVER AL MENÚ</button>
            </div>
        </div>

    </div>

    <script>
        // DB y Memoria
        let base = JSON.parse(localStorage.getItem('hogar_v10')) || {};
        let lastUsr = localStorage.getItem('last_user') || "";

        // Auto-relleno al inicio
        window.onload = () => {
            if (lastUsr && base[lastUsr]) {
                document.getElementById('usuario').value = lastUsr;
                document.getElementById('clave').value = base[lastUsr].pass;
            }
        };

        // Escucha de tecla ENTER para el Login
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && document.getElementById('p-login').classList.contains('activa')) {
                entrar();
            }
        });

        function verClave() {
            const input = document.getElementById('clave');
            const icon = document.getElementById('ojo-img');
            input.type = (input.type === "password") ? "text" : "password";
            icon.classList.toggle('fa-eye');
            icon.classList.toggle('fa-eye-slash');
        }

        function navegar(id) {
            document.querySelectorAll('.pantalla').forEach(p => p.classList.remove('activa'));
            document.getElementById(id).classList.add('activa');
        }

        function entrar() {
            const u = document.getElementById('usuario').value.trim().toLowerCase();
            const p = document.getElementById('clave').value;
            if (!u || !p) return;

            if (!base[u]) {
                base[u] = { pass: p, in: [], out: [] };
                localStorage.setItem('hogar_v10', JSON.stringify(base));
            }

            if (base[u].pass === p) {
                localStorage.setItem('last_user', u);
                document.getElementById('usr-tag').innerText = "BIENVENIDO: " + u;
                navegar('p-menu');
            } else {
                alert("Clave incorrecta");
            }
        }

        function preguntarListado() { navegar('p-preg-listado'); }

        // Router para las secciones (se afectará solo según pidas)
        function irSeccion(seccion) {
            console.log("Entrando a: " + seccion);
            // Las siguientes fases del proyecto se inyectarán aquí
            if(seccion !== 'p-menu') alert('Has seleccionado: ' + seccion);
        }
    </script>
</body>
</html>
