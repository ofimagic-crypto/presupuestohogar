<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presupuesto Hogar - Ebooks Magic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .contenedor-app { max-width: 500px; margin: 0 auto; min-height: 100vh; background: #f1f5f9; }
        .pantalla { display: none; }
        .pantalla.activa { display: block; }
        
        /* Inputs con borde fuerte para que se vean bien */
        input { border: 2px solid #cbd5e1 !important; border-radius: 14px; padding: 14px; width: 100%; outline: none; }
        input:focus { border-color: #3b82f6 !important; }

        /* Contenedor del ojo para que esté ADENTRO */
        .wrapper-pass { position: relative; width: 100%; }
        .btn-ojo { 
            position: absolute; 
            right: 15px; 
            top: 50%; 
            transform: translateY(-50%); 
            z-index: 20; 
            padding: 10px;
            color: #64748b;
            cursor: pointer;
        }

        /* Botón que sí se siente al presionar */
        .btn-accion {
            background-color: #1e293b;
            color: white;
            width: 100%;
            padding: 18px;
            border-radius: 16px;
            font-weight: 900;
            text-transform: uppercase;
            transition: 0.1s;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
        }
        .btn-accion:active { transform: scale(0.96); background-color: #000; }
    </style>
</head>
<body class="bg-slate-300">
    <div class="contenedor-app p-4 shadow-2xl flex flex-col font-sans">
        
        <header class="text-center py-4 border-b-2 border-slate-200 mb-6">
            <h1 class="text-2xl font-black text-slate-800">PRESUPUESTO HOGAR</h1>
            <p class="text-blue-600 font-bold text-sm italic">Ebooks Magic</p>
        </header>

        <div id="pantalla-login" class="pantalla activa space-y-6">
            <div class="bg-white p-8 rounded-[2.5rem] shadow-xl border text-center">
                <div class="space-y-4">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Identificación</p>
                    
                    <input type="text" id="user-id" placeholder="Usuario" class="text-center font-bold uppercase">
                    
                    <div class="wrapper-pass">
                        <input type="password" id="user-pass" placeholder="Contraseña" class="text-center font-bold">
                        <div class="btn-ojo" onclick="gestionarOjo()">
                            <i id="ojo-icon" class="fa-solid fa-eye"></i>
                        </div>
                    </div>

                    <button type="button" onclick="entrarAlSistema()" class="btn-accion">
                        Entrar / Registrarse
                    </button>
                    
                    <p class="text-[9px] text-slate-400 font-medium">Si el usuario no existe, se creará ahora mismo.</p>
                </div>
            </div>
        </div>

        <div id="pantalla-menu" class="pantalla space-y-4">
            <div class="bg-slate-800 text-white p-6 rounded-[2.5rem] text-center border-b-4 border-blue-500">
                <p id="usr-tag" class="text-[10px] text-blue-300 font-bold uppercase mb-2"></p>
                <h2 id="saldo-main" class="text-4xl font-black">$ 0</h2>
            </div>
            <div class="grid grid-cols-1 gap-3">
                <button onclick="irABloque('ingresos')" class="bg-emerald-500 text-white p-5 rounded-2xl font-bold flex justify-between shadow"><span>💰 Ingresos</span> <i class="fa-solid fa-chevron-right"></i></button>
                <button onclick="irABloque('gastos')" class="bg-rose-500 text-white p-5 rounded-2xl font-bold flex justify-between shadow"><span>💸 Gastos</span> <i class="fa-solid fa-chevron-right"></i></button>
                <button onclick="irAResumen()" class="bg-blue-600 text-white p-5 rounded-2xl font-bold flex justify-between shadow"><span>📊 Resumen General</span> <i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <button onclick="location.reload()" class="w-full text-slate-400 text-xs font-bold py-10">CERRAR SESIÓN</button>
        </div>

        <div id="pantalla-gestion" class="pantalla space-y-4">
            <div class="bg-white p-4 rounded-2xl flex justify-between items-center shadow-sm border">
                <h2 id="tit-seccion" class="font-black uppercase"></h2>
                <span id="suma-seccion" class="font-black text-blue-600"></span>
            </div>
            
            <div class="bg-white rounded-2xl shadow border max-h-64 overflow-y-auto">
                <table class="w-full text-sm">
                    <tbody id="lista-items"></tbody>
                </table>
            </div>

            <div class="bg-slate-800 p-5 rounded-3xl space-y-3 shadow-2xl">
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="add-det" placeholder="Concepto" class="text-sm">
                    <input type="date" id="add-fec" class="text-sm">
                </div>
                <div class="flex gap-2">
                    <input type="number" id="add-val" placeholder="Valor $" class="flex-1 font-bold">
                    <button onclick="crearRegistro()" class="bg-emerald-500 text-white px-8 rounded-xl font-black text-xl">OK</button>
                </div>
            </div>
