<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presupuesto Hogar - Ebooks Magic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .contenedor-app { max-width: 500px; margin: 0 auto; min-height: 100vh; background: #f1f5f9; }
        .pantalla { display: none; }
        .pantalla.activa { display: block; }
        
        input { 
            border: 2px solid #cbd5e1 !important; 
            border-radius: 12px; 
            padding: 14px; 
            width: 100%; 
            outline: none; 
            background: white;
        }

        /* Contenedor del ojo corregido */
        .caja-password { position: relative; width: 100%; display: flex; align-items: center; }
        .btn-ojo { 
            position: absolute; 
            right: 10px; 
            height: 100%; 
            width: 45px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            z-index: 100; /* Asegura que esté por encima de todo */
        }

        .boton-entrar {
            background-color: #0f172a;
            color: white;
            width: 100%;
            padding: 18px;
            border-radius: 16px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            margin-top: 20px;
        }
        .boton-entrar:active { transform: scale(0.95); }
    </style>
</head>
<body class="bg-slate-300">

    <div class="contenedor-app p-4 flex flex-col font-sans">
        
        <header class="text-center py-4 border-b-2 border-slate-200 mb-6">
            <h1 class="text-2xl font-black text-slate-800 uppercase">Presupuesto Hogar</h1>
            <p class="text-blue-600 font-bold text-sm">Ebooks Magic</p>
        </header>

        <div id="pantalla-login" class="pantalla activa">
            <div class="bg-white p-8 rounded-[2rem] shadow-2xl border space-y-4">
                
                <div>
                    <input type="text" id="usr" placeholder="Usuario" class="text-center font-bold">
                </div>

                <div class="caja-password">
                    <input type="password" id="psw" placeholder="Contraseña" class="text-center font-bold">
                    <div class="btn-ojo" onclick="revelar()">
                        <i id="ojo-icon" class="fa-solid fa-eye text-slate-400"></i>
                    </div>
                </div>

                <button type="button" onclick="entrar()" class="boton-entrar">
                    Entrar
                </button>
            </div>
        </div>

        <div id="pantalla-menu" class="pantalla space-y-4">
            <div class="bg-slate-800 text-white p-6 rounded-[2rem] text-center border-b-4 border-blue-500">
                <p id="usr-display" class="text-blue-300 text-[10px] font-bold uppercase mb-2"></p>
                <h2 id="saldo-total" class="text-4xl font-black">$ 0</h2>
            </div>
            <div class="grid gap-3">

                <button onclick="alert('Gastos')" class="bg-rose-500 text-white p-5 rounded-xl font-bold uppercase shadow">💸 Gastos</button>
